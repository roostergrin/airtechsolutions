<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" width="360" height="254.79" viewBox="0 0 360 254.79">
  <defs>
    <linearGradient id="ats-logo-base-gradient" x1="0" y1="0" x2="360" y2="254.79" gradientUnits="userSpaceOnUse">
      <stop class="ats-logo-base-1" offset="0"/>
      <stop class="ats-logo-base-2" offset="0.5"/>
      <stop class="ats-logo-base-3" offset="1"/>
    </linearGradient>
    <linearGradient id="ats-logo-lettering-gradient" x1="0" y1="0" x2="360" y2="254.79" gradientUnits="userSpaceOnUse">
      <stop class="ats-logo-lettering-1" offset="0"/>
      <stop class="ats-logo-lettering-2" offset="0.48"/>
      <stop class="ats-logo-lettering-3" offset="1"/>
    </linearGradient>
    <linearGradient id="ats-logo-wave-1-reveal" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop class="ats-logo-wave-1-1" offset="0"/>
      <stop class="ats-logo-wave-1-2" offset="0">
        <animate attributeName="offset" values="0;0.5" dur="1s" begin="0.25s" fill="freeze"/>
      </stop>
      <stop class="ats-logo-wave-1-3" offset="0">
        <animate attributeName="offset" values="0;1" dur="1s" begin="0.25s" fill="freeze"/>
      </stop>
      <stop class="ats-logo-base-1" offset="0">
        <animate attributeName="offset" values="0;1" dur="1s" begin="0.25s" fill="freeze"/>
      </stop>
      <stop class="ats-logo-base-1" offset="1"/>
    </linearGradient>
    <linearGradient id="ats-logo-wave-2-reveal" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop class="ats-logo-wave-2-1" offset="0"/>
      <stop class="ats-logo-wave-2-2" offset="0">
        <animate attributeName="offset" values="0;0.5" dur="1s" begin="0.25s" fill="freeze"/>
      </stop>
      <stop class="ats-logo-wave-2-3" offset="0">
        <animate attributeName="offset" values="0;1" dur="1s" begin="0.25s" fill="freeze"/>
      </stop>
      <stop class="ats-logo-base-1" offset="0">
        <animate attributeName="offset" values="0;1" dur="1s" begin="0.25s" fill="freeze"/>
      </stop>
      <stop class="ats-logo-base-1" offset="1"/>
    </linearGradient>
    <style>
      .cls-1 {
        fill: url(#ats-logo-base-gradient);
      }

      .ats-logo-text .cls-1 {
        fill: url(#ats-logo-lettering-gradient);
      }

      .cls-2 {
        fill: url(#ats-logo-wave-1-reveal);
      }

      .cls-3 {
        fill: url(#ats-logo-wave-2-reveal);
      }

      .ats-logo-base-1 {
        stop-color: var(--logo-base-1, #fff);
      }

      .ats-logo-base-2 {
        stop-color: var(--logo-base-2, #fff);
      }

      .ats-logo-base-3 {
        stop-color: var(--logo-base-3, #fff);
      }

      .ats-logo-lettering-1 {
        stop-color: var(--logo-lettering-1, #d6e7f5);
      }

      .ats-logo-lettering-2 {
        stop-color: var(--logo-lettering-2, #adc8e8);
      }

      .ats-logo-lettering-3 {
        stop-color: var(--logo-lettering-3, #7fa4cc);
      }

      .ats-logo-wave-1-1 {
        stop-color: var(--logo-wave-1-1, #adc8e8);
      }

      .ats-logo-wave-1-2 {
        stop-color: var(--logo-wave-1-2, #adc8e8);
      }

      .ats-logo-wave-1-3 {
        stop-color: var(--logo-wave-1-3, #adc8e8);
      }

      .ats-logo-wave-2-1 {
        stop-color: var(--logo-wave-2-1, #02437f);
      }

      .ats-logo-wave-2-2 {
        stop-color: var(--logo-wave-2-2, #02437f);
      }

      .ats-logo-wave-2-3 {
        stop-color: var(--logo-wave-2-3, #02437f);
      }

      .ats-logo-pop {
        transform-box: fill-box;
        transform-origin: center;
        animation: ats-logo-pop 0.75s cubic-bezier(0.22, 1, 0.36, 1) 1.55s both;
      }

      @keyframes ats-logo-pop {
        0% {
          transform: scale(1);
        }

        42% {
          transform: scale(1.025);
        }

        72% {
          transform: scale(0.997);
        }

        100% {
          transform: scale(1);
        }
      }
    </style>
  </defs>
